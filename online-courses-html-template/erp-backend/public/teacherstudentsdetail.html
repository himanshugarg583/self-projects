<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-6">
        <!-- Student Details Form -->
        <div class="bg-white p-6 rounded-xl shadow-lg max-w-lg mx-auto">
            <h2 class="font-extrabold text-xl text-gray-700 mb-4">Enter Student Details</h2>
            <form action="/post" method="POST">
                <div class="mb-4">
                    <label class="font-medium">Student Name</label>
                    <input type="text" name="studentName" class="form-input w-full" placeholder="Enter Name" required>
                </div>

                <div class="mb-4">
                    <label class="font-medium">Roll No</label>
                    <input type="number" name="rollNo" class="form-input w-full" placeholder="Enter Roll No" required>
                </div>

                <div class="mb-4">
                    <label class="font-medium">Date of Birth</label>
                    <input type="date" name="dob" class="form-input w-full" required>
                </div>

                <div class="mb-4">
                    <label class="font-medium">Father's Name</label>
                    <input type="text" name="fatherName" class="form-input w-full" placeholder="Enter Father's Name" required>
                </div>

                <div class="mb-4">
                    <label class="font-medium">Mother's Name</label>
                    <input type="text" name="motherName" class="form-input w-full" placeholder="Enter Mother's Name" required>
                </div>

                <div class="mb-4">
                    <label class="font-medium">Aadhar Number</label>
                    <input type="text" name="aadharCard" class="form-input w-full" placeholder="Enter Aadhar Number" required>
                </div>

                <div class="mb-4">
                    <label class="font-medium">Achievements</label>
                    <textarea name="achievements" class="form-input w-full" placeholder="Enter student's achievements" required></textarea>
                </div>

                <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded mt-4 w-full">Save Details</button>
            </form>
        </div>
    </div>

</body>
</html>
