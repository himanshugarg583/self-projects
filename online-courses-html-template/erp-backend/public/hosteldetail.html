        body {

        .header {
            background-color: #333;

            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);

        .header .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .header .logo-container img {
            height: 50px;
            border-radius: 50%;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .header p {

            font-size: 1rem;
        }

        .header .contact-info {

        }

        .content {

            width: 95%;

            padding: 20px;
        }

        .title {
            text-align: center;
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .form-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #4CAF50;
        }

        .form-container form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .form-container form .form-group {
            flex: 1 1 calc(50% - 20px);
            display: flex;
            flex-direction: column;
        }

        .form-container form .form-group label {
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-container form .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        .form-container form .form-group input:focus {
            border-color: #4CAF50;
        }

        .form-container .submit-btn {
            flex: 1 1 100%;
            text-align: center;
        }

        .form-container .submit-btn button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .form-container .submit-btn button:hover {
            background-color: #45a049;
        }

        .table-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
            text-transform: uppercase;
        }

        td {
            background-color: #f9f9f9;
        }

        td:hover {
            background-color: #eaf1e8;
        }

        .footer {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        .footer p {
            margin: 0;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .form-container form .form-group {
                flex: 1 1 100%;
            }

            .form-container form {
                gap: 15px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p,
            .header .contact-info {

        }

const form = document.getElementById('admissionForm');
        const API_URL = 'http://localhost:3000/students'; // Backend API URL

        form.addEventListener('submit', async function (event) {
            event.preventDefault(); // Prevent page refresh

            // Get form values
            const student = {
                studentName: document.getElementById('studentName').value,
                roomNumber: document.getElementById('roomNumber').value,
                admissionNumber: document.getElementById('admissionNumber').value,
                gender: document.getElementById('gender').value,
                admissionDate: document.getElementById('admissionDate').value,
                contact: document.getElementById('contact').value
            };

            try {
                // Send data to backend
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(student)
                });

                if (response.ok) {
                    alert("Student added successfully!");
                    form.reset(); // Clear the form
                } else {
                    const errorData = await response.json();
                    console.error('Error adding student:', errorData);
                    alert('Error: ' + errorData.error);
                }
            } catch (error) {
                console.error('Error adding student:', error);
                alert('Error: Unable to add student.');
            }
        });
