<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student Form</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Header Style */
        .header {
            width: 100%;
            background-color: #333;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        .header .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .header .logo-container img {
            height: 50px;
            border-radius: 50%;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .header p {
            margin: 0;
            font-size: 0.9rem;
        }

        .header .contact-info {
            font-size: 0.8rem;
            margin-top: 10px;
        }

        /* Main Form Style */
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
            margin-top: 20px;
            box-sizing: border-box; /* Prevents overflow due to padding */
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-section h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #444;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input, select, textarea {
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box; /* Ensures padding is included in width */
        }

        input:focus, select:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }

        button {
            padding: 14px 24px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            box-sizing: border-box; /* Prevents overflow due to padding */
        }

        button:hover {
            background-color: #45a049;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .gender-radio, .marital-status-radio {
            display: flex;
            gap: 15px;
        }

        /* Animations */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Footer Style */
        .footer {
            width: 100%;
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .footer p {
            margin: 0;
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                width: 90%;
            }

            h2 {
                font-size: 1.5rem;
            }

            button {
                font-size: 14px;
            }

            .form-section h3 {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            h2 {
                font-size: 1.2rem;
            }

            button {
                font-size: 12px;
            }

            .form-section h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo-container">
            <img src="img/logo mps.jpg" alt="MPS School Logo">
            <div class="text-center">
                <h1>Maheshwari Public School</h1>
                <p>Affiliated to CBSE, Delhi</p>
                <div class="contact-info">
                    <p>Email: mpskijaipur@gmail.com</p>
                    <p>Contact: +91 9876543210, +91 7412949000</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Container -->
    <div class="container">
        <h2>Add Student Form</h2>
        <form id="studentForm" onsubmit="submitStudentForm(); return false;">
            <!-- Personal Details -->
            <div class="form-section">
                <h3>Personal Details</h3>
                <label for="studentName">Name:</label>
                <input type="text" id="studentName" name="studentName" required>

                <label for="fatherName">Father's Name:</label>
                <input type="text" id="fatherName" name="fatherName" required>

                <label for="motherName">Mother's Name:</label>
                <input type="text" id="motherName" name="motherName" required>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

                <label for="gender">Gender:</label>
                <div class="gender-radio" id="gender">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
            </div>

            <!-- Address -->
            <div class="form-section">
                <h3>Address</h3>
                <label for="currentAddress">Current Address:</label>
                <input type="text" id="currentAddress" name="currentAddress" required>

                <label for="permanentAddress">Permanent Address:</label>
                <input type="text" id="permanentAddress" name="permanentAddress" required>
            </div>

            <!-- School and Admission Details -->
            <div class="form-section">
                <h3>School and Admission Details</h3>
                <label for="admissionNo">Admission Number:</label>
                <input type="text" id="admissionNo" name="admissionNo" required>

                <label for="grade">Grade/Year:</label>
                <input type="text" id="grade" name="grade" required>

                <label for="medicalHistory">Medical History:</label>
                <textarea id="medicalHistory" name="medicalHistory" rows="4" required></textarea>
            </div>

            <!-- Contact Details -->
            <div class="form-section">
                <h3>Contact Details</h3>
                <label for="motherContact">Mother Contact Number:</label>
                <input type="number" id="motherContact" name="motherContact" required>

                <label for="fatherContact">Father Contact Number:</label>
                <input type="number" id="fatherContact" name="fatherContact" required>

                <label for="emergencyContact">Emergency Number:</label>
                <input type="number" id="emergencyContact" name="emergencyContact" required>

            </div>


            <div class="form-section">
                <h3>Qualification</h3>
                <label for="motherqualification">Mother Qualification:</label>
                <input type="text" id="motherqualification" name="motherqualification" required>

                <label for="fatherqualification">Father Qualification:</label>
                <input type="text" id="fatherqualification" name="fatherqualification" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2025 MPS School. All rights reserved.</p>
    </div>

    <script>
        function submitStudentForm(event) {
            event.preventDefault();
            const form = document.getElementById('studentForm');
            const formData = new FormData(form);

            const studentData = {};
            formData.forEach((value, key) => {
                studentData[key] = value;
            });
            console.log(studentData);

            fetch('http://localhost:3000/add-student', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(studentData),
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Student added successfully') {
                    alert('Student added successfully');
                    form.reset();
                } else {
                    alert('Failed to add student');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error adding student');
            });
        }
    </script>

</body>
</html>
